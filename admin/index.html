<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://alpbdchqxuaqjivhybcd.supabase.co; connect-src 'self' https://alpbdchqxuaqjivhybcd.supabase.co; base-uri 'none'; form-action 'self'">
<title>Admin 后台 | Hiyori's Little World</title>
<link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<section id="login" class="login" hidden>
  <form id="login-form" class="login-card" autocomplete="on">
    <h1>Hiyori's Little World</h1>
    <p class="sub">Admin Dashboard <span class="zh">管理后台</span></p>
    <label>Email <span class="zh">邮箱</span><input type="email" name="email" autocomplete="username" required></label>
    <label>Password <span class="zh">密码</span><input type="password" name="password" autocomplete="current-password" required></label>
    <p id="login-err" class="err" role="alert"></p>
    <button class="btn primary" id="login-btn">Sign in <span class="zh">登录</span></button>
    <p class="note">Staff only. Customers cannot sign in here. <span class="zh">仅限工作人员。</span></p>
  </form>
</section>
<div id="shell" class="shell" hidden>
  <aside class="side" id="side">
    <div class="brand">Hiyori's Little World<small>Admin 后台</small></div>
    <nav id="nav" aria-label="Admin"></nav>
    <div class="who"><span id="who"></span><button class="btn small" id="logout">Sign out <span class="zh">退出</span></button></div>
  </aside>
  <main class="main">
    <header class="top"><button class="btn small menu" id="menu" aria-label="Menu">☰</button><h1 id="title"></h1><span class="demo" id="envnote"></span></header>
    <div id="view" class="view"></div>
  </main>
</div>
<div id="modal-root"></div><div id="toast" class="toast" role="status"></div>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/app2.js"></script>
<script src="js/app3.js"></script>
</body>
</html>
